    <!-- Structured Data (JSON-LD) -->
    <script id="vitrimini-jsonld" type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "VitriMini",
          "url": "https://vitrimini.com.br/",
          "logo": "https://vitrimini.com.br/og-cover.png"
        },
        {
          "@context": "https://schema.org",
          "@type": "SoftwareApplication",
          "name": "VitriMini",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "inLanguage": "pt-BR",
          "url": "https://vitrimini.com.br/",
          "description": "Criador de vitrines digitais e catálogos online com pedidos organizados no WhatsApp, acompanhamento em tempo real e cálculo automático de sinal via Pix.",
          "offers": {
            "@type": "Offer",
            "price": "24.90",
            "priceCurrency": "BRL",
            "availability": "https://schema.org/InStock"
          }
        },
        {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Tem mensalidade ou cobrança automática depois dos 90 dias?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Não. O pagamento de R$ 24,90 é feito uma única vez via Pix e libera sua vitrine por 90 dias corridos. Não pedimos cartão de crédito e nunca fazemos cobranças automáticas."
              }
            },
            {
              "@type": "Question",
              "name": "Vocês cobram alguma taxa sobre as encomendas que eu vender?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Zero comissão. Todo o valor das suas vendas e o sinal pago pelos seus clientes caem diretamente na sua conta usando a sua própria chave Pix."
              }
            },
            {
              "@type": "Question",
              "name": "Como meu cliente acompanha o status do pedido? Precisa baixar app?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Não precisa baixar nenhum aplicativo. Assim que você registra ou atualiza o pedido, um link exclusivo de acompanhamento em tempo real é gerado para o cliente ver cada etapa direto no navegador."
              }
            },
            {
              "@type": "Question",
              "name": "Consigo alterar preços ou marcar um produto como esgotado depois de publicar?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim. Você pode pausar itens esgotados em 1 toque, mudar preços, atualizar datas e turnos de entrega ou adicionar novos produtos quando quiser pelo painel da vitrine."
              }
            },
            {
              "@type": "Question",
              "name": "Existe limite de quantos produtos posso cadastrar na minha vitrine?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Não há limite. Você pode cadastrar quantos doces, marmitas, peças ou produtos sob encomenda desejar, todos com foto, descrição e preço."
              }
            },
            {
              "@type": "Question",
              "name": "Posso testar a vitrine antes de pagar os R$ 24,90?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim. Você monta sua vitrine completa, escolhe a cor da marca, cadastra os produtos e testa tudo gratuitamente. O pagamento único via Pix só é feito quando você decidir publicar."
              }
            }
          ]
        }
      ]
    </script>
